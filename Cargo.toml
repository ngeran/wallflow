[package]
name = "wallflow"
version = "5.0.0"
edition = "2021"
authors = ["WallFlow Contributors"]
description = "Automatic wallpaper rotation for Hyprland with hyprpaper integration"

[[bin]]
name = "wallflow"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Time handling
chrono = "0.4"

# File system operations
dirs = "6.0"
walkdir = "2.4"

# Random selection
rand = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process execution
sysinfo = "0.38"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
